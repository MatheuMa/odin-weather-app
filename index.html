<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Odin Weather App</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <form class="search-form">
      <div class="search-location">
        <input type="text" id="location-input" name="location-input" />
        <button class="search-button" type="submit">Search Location</button>
      </div>
      <div class="units-div">
        <input type="checkbox" id="toggle-units" name="toggle-units" />
        <label for="toggle-units">United States customary units</label>
      </div>
    </form>
  </body>
</html>
