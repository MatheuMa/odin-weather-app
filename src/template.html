<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Odin Weather App</title>
  </head>
  <body>
    <form class="search-form">
      <div class="top-nav">
        <div class="top-search">
          <div class="search-location">
            <input type="text" id="location-input" name="location-input" />
            <button class="search-button" type="submit">Search Location</button>
          </div>
          <div class="units-div">
            <input type="checkbox" id="toggle-units" name="toggle-units" />
            <label for="toggle-units">United States customary units</label>
          </div>
        </div>
      </div>
      <h2 class="location"></h2>
      <div class="weather-board">
        <div class="weather-today">
          <div class="current-temp">
            <h2>Temperature</h2>
            <h3></h3>
          </div>
          <div class="current-feelslike">
            <h2>It Feels Like</h2>
            <h3></h3>
          </div>
          <div class="current-UV">
            <h2>UV index</h2>
            <h3></h3>
          </div>
          <div class="today-temp">
            <h2>Daily Temp.</h2>
            <div class="today-data">
              <p class="row-title">High</p>
              <p class="today-temp-high"></p>
              <p class="row-title">Low</p>
              <p class="today-temp-low"></p>
              <p class="row-title">Avg</p>
              <p class="today-temp-avg"></p>
            </div>
          </div>
          <div class="today-feelslike">
            <h2>Daily Feel.</h2>
            <div class="today-data">
              <p class="row-title">High</p>
              <p class="today-feels-high"></p>
              <p class="row-title">Low</p>
              <p class="today-feels-low"></p>
              <p class="row-title">Avg</p>
              <p class="today-feels-avg"></p>
            </div>
          </div>
          <div class="today-UV">
            <h2>UV (Max.)</h2>
            <p class="today-UV-p"></p>
          </div>
        </div>
        <div class="forecasts"></div>
      </div>
    </form>
  </body>
</html>
